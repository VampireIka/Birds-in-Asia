<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>关东野鸟共享图鉴</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script>
  <style>
    body { background-color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
    .bird-card { cursor: pointer; transition: all 0.3s ease; }
    .bird-card:hover { transform: translateY(-4px); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }
    .modal-overlay { background-color: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); }
  </style>
</head>
<body class="text-slate-800">

  <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-6 py-5 flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-2xl font-bold tracking-tight">📸 关东野鸟共享图鉴</h1>
        <p class="text-xs text-slate-400 mt-1" id="statusHeader">正在连接云端数据库...</p>
      </div>
      <div class="flex items-center gap-3 w-full md:w-auto overflow-x-auto pb-2 md:pb-0">
        <span id="userBadge" class="hidden text-xs bg-slate-700 text-slate-300 px-3 py-1 rounded-full whitespace-nowrap"></span>
        <input type="text" id="searchInput" placeholder="搜索鸟名..." class="px-3 py-1.5 rounded-lg text-slate-900 w-32 md:w-48 text-sm">
        
        <a href="https://docs.google.com/spreadsheets/d/1NtqLuEfwxV7JtTF1O9yqnL9uoet0BlXrkBU72wrXwKs/edit" target="_blank" class="bg-amber-500 hover:bg-amber-600 text-slate-900 px-3 py-1.5 rounded-lg text-sm font-bold transition whitespace-nowrap shadow-sm flex items-center gap-1">
          <span>➕</span> 补充新鸟类
        </a>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-8">
    <div id="loadingIndicator" class="text-center py-20 text-slate-500">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-slate-900 mb-4"></div>
      <p>正在从云端加载百科与打卡记录，请稍候...</p>
    </div>
    <div id="birdGrid" class="gallery-grid hidden"></div>
  </main>

  <div id="detailModal" class="fixed inset-0 modal-overlay hidden z-40 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto shadow-2xl relative flex flex-col md:flex-row">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700 text-3xl font-bold z-50">&times;</button>
      
      <div class="md:w-1/3 bg-slate-50 p-6 border-r border-slate-200">
        <div id="birdInfoBox"></div>
      </div>

      <div class="md:w-2/3 p-6 flex flex-col">
        <h3 class="font-bold text-lg mb-4">🖼️ 摄影打卡墙</h3>
        
        <div class="bg-blue-50 border border-blue-100 rounded-xl p-4 mb-6">
          <input type="text" id="uploadAuthor" placeholder="你的昵称 (填一次即永久记住)" class="w-full border rounded-lg px-3 py-2 mb-3 text-sm font-semibold text-blue-900 bg-white">
          
          <div class="flex justify-between items-end mb-2">
            <p class="text-sm font-semibold text-blue-900">选择照片 <span class="text-xs font-normal text-slate-500">(尽量上传原图以读取参数)</span></p>
            <span id="exifStatus" class="text-xs text-slate-500"></span>
          </div>
          <input type="file" id="photoInput" accept="image/*" class="text-sm w-full mb-3" onchange="handlePhotoSelect(event)">
          
          <div class="grid grid-cols-2 gap-3 text-sm">
            <input type="text" id="exifCamera" placeholder="相机型号 (自动识别或手填)" class="w-full border rounded px-2 py-1.5 bg-white">
            <input type="text" id="exifSettings" placeholder="曝光参数 (自动识别或手填)" class="w-full border rounded px-2 py-1.5 bg-white">
            <input type="text" id="photoLocation" placeholder="拍摄地点" class="col-span-2 w-full border rounded px-2 py-1.5 bg-white">
          </div>
          <button id="submitBtn" onclick="submitPhoto()" class="mt-4 bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-2 rounded-lg text-sm w-full transition">上传打卡</button>
        </div>
        
        <div id="photoWall" class="grid grid-cols-1 sm:grid-cols-2 gap-4 overflow-y-auto"></div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbym5PLC9DvHXoGSN10fEOTpovbrbwFsBid_Cqh4PHUTBcZBkozuzSV5H1KNWv6-O_M9ww/exec";
    
    let birdsData = [];
    let currentBird = null;
    let pendingImageObj = null;

    window.onload = function() {
      const savedName = localStorage.getItem('kanto_bird_user');
      if (savedName) {
        document.getElementById('uploadAuthor').value = savedName;
        const badge = document.getElementById('userBadge');
        badge.innerText = "👋 欢迎回来, " + savedName;
        badge.classList.remove('hidden');
      }

      // 使用原生 JSONP 方式加载数据，绝不产生跨域拦截
      window.handleBirdData = function(res) {
        if(res && res.status === 'success') {
          birdsData = res.data;
          document.getElementById('statusHeader').innerText = "已成功加载 " + birdsData.length + " 种鸟类百科";
          document.getElementById('loadingIndicator').classList.add('hidden');
          document.getElementById('birdGrid').classList.remove('hidden');
          renderGallery();
        } else {
          document.getElementById('loadingIndicator').innerHTML = `<p class="text-red-500">数据加载失败：${res ? res.message : '未知错误'}</p>`;
        }
      };

      const script = document.createElement('script');
      script.src = API_URL + "?callback=handleBirdData";
      script.onerror = function() {
        document.getElementById('loadingIndicator').innerHTML = `<p class="text-red-500">连接数据库失败，请检查网络或稍后重试。</p>`;
      };
      document.body.appendChild(script);
    };

    function renderGallery() {
      const grid = document.getElementById('birdGrid');
      const query = document.getElementById('searchInput').value.toLowerCase();
      grid.innerHTML = '';
      
      birdsData.filter(b => (b.zhName && b.zhName.toLowerCase().includes(query)) || (b.jpName && b.jpName.toLowerCase().includes(query))).forEach(bird => {
        let coverImg = '';
        let isPlaceholder = true;

        if (bird.photos && bird.photos.length > 0) {
          let starredPhoto = bird.photos.find(p => (p.location && p.location.includes('⭐')) || (p.author && p.author.includes('⭐')) || (p.cameraInfo && p.cameraInfo.includes('⭐')));
          coverImg = starredPhoto ? starredPhoto.url : bird.photos[0].url;
          isPlaceholder = false;
        }

        if(coverImg && coverImg.includes('drive.google.com')) {
          const idMatch = coverImg.match(/[-\w]{25,}/);
          if (idMatch) coverImg = `https://drive.google.com/thumbnail?id=${idMatch[0]}&sz=w800`;
        }

        let imageHtml = isPlaceholder 
          ? `<div class="w-full h-full flex flex-col items-center justify-center text-slate-400 bg-slate-50 border-b border-slate-100"><span class="text-4xl mb-2 opacity-30">📷</span><span class="text-xs font-medium tracking-wider">首张照片等你来打卡</span></div>`
          : `<img src="${coverImg}" class="w-full h-full object-cover">`;

        grid.innerHTML += `
          <div class="bird-card bg-white rounded-xl overflow-hidden border border-slate-200" onclick="openBirdModal('${bird.id}')">
            <div class="h-48 w-full bg-slate-100 relative">${imageHtml}</div>
            <div class="p-4">
              <div class="flex justify-between items-baseline mb-1">
                <h2 class="font-bold text-lg">${bird.zhName}</h2>
                <span class="text-sm font-medium text-blue-600">${bird.jpName}</span>
              </div>
              <p class="text-xs text-slate-500 truncate">📍 ${bird.spots}</p>
              <p class="text-xs mt-2 text-slate-400">📸 ${bird.photos ? bird.photos.length : 0} 张打卡</p>
            </div>
          </div>`;
      });
    }

    function openBirdModal(id) {
      currentBird = birdsData.find(b => b.id === id);
      document.getElementById('birdInfoBox').innerHTML = `
        <h2 class="text-3xl font-bold text-slate-900 mb-1">${currentBird.zhName}</h2>
        <p class="text-lg text-blue-700 font-semibold mb-4">${currentBird.jpName}</p>
        <div class="space-y-4 text-sm text-slate-700">
          <div><span class="font-bold block text-slate-900">英文名</span>${currentBird.enName}</div>
          <div><span class="font-bold block text-slate-900">季节类型</span><span class="inline-block bg-blue-100 text-blue-800 px-2 py-0.5 rounded text-xs mt-1">${currentBird.season}</span></div>
          <div><span class="font-bold block text-slate-900">观测点</span>${currentBird.spots}</div>
          <div><span class="font-bold block text-slate-900">外观习性</span>${currentBird.desc}</div>
        </div>`;
      
      renderPhotoWall();
      
      document.getElementById('photoInput').value = '';
      document.getElementById('exifCamera').value = '';
      document.getElementById('exifSettings').value = '';
      document.getElementById('exifStatus').innerText = '';
      pendingImageObj = null;

      document.getElementById('detailModal').classList.remove('hidden');
    }

    function renderPhotoWall() {
      const wall = document.getElementById('photoWall');
      if (!currentBird.photos || currentBird.photos.length === 0) {
        wall.innerHTML = '<div class="col-span-2 text-center text-slate-400 py-6 text-sm">暂无打卡记录。</div>';
        return;
      }
      
      wall.innerHTML = currentBird.photos.map(p => {
        let imgUrl = p.url;
        if(imgUrl && imgUrl.includes('drive.google.com')) {
           const idMatch = imgUrl.match(/[-\w]{25,}/);
           if (idMatch) imgUrl = `https://drive.google.com/thumbnail?id=${idMatch[0]}&sz=w800`;
        }
        
        let isStarred = (p.location && p.location.includes('⭐')) || (p.author && p.author.includes('⭐')) || (p.cameraInfo && p.cameraInfo.includes('⭐'));
        let authorText = (p.author || '匿名').replace('⭐', '');
        let locText = (p.location || '未知').replace('⭐', '');
        let camText = (p.cameraInfo || '无器材信息').replace('⭐', '');

        let starBadge = isStarred ? `<div class="absolute top-2 right-2 bg-amber-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow-md z-10">⭐ 封面精选</div>` : '';
        let borderClass = isStarred ? 'border-amber-400 ring-2 ring-amber-100' : 'border-slate-200';

        return `
        <div class="border ${borderClass} rounded-xl overflow-hidden bg-white shadow-sm relative">
          ${starBadge}
          <div class="h-40 bg-slate-100 flex items-center justify-center">
            <img src="${imgUrl}" class="w-full h-full object-cover">
          </div>
          <div class="p-3 text-[11px] text-slate-600">
            <div class="flex justify-between font-bold text-slate-800 text-xs mb-1">
              <span>👤 ${authorText}</span>
              <span class="text-slate-400 font-normal">${p.date}</span>
            </div>
            <p>📍 ${locText}</p>
            <p class="text-slate-400 truncate mt-1">📷 ${camText}</p>
          </div>
        </div>`;
      }).join('');
    }

    function closeModal() { document.getElementById('detailModal').classList.add('hidden'); }

    async function handlePhotoSelect(event) {
      const file = event.target.files[0];
      if (!file) return;
      
      const statusText = document.getElementById('exifStatus');
      statusText.innerText = "正在读取参数...";
      statusText.className = "text-xs text-blue-500";

      const reader = new FileReader();
      reader.onload = (e) => { pendingImageObj = e.target.result; };
      reader.readAsDataURL(file);

      try {
        const exifData = await exifr.parse(file);
        if (exifData && (exifData.Make || exifData.FNumber)) {
          document.getElementById('exifCamera').value = [exifData.Make, exifData.Model].filter(Boolean).join(' ') || '';
          let settings = [];
          if (exifData.FNumber) settings.push(`f/${exifData.FNumber}`);
          if (exifData.ExposureTime) settings.push(`1/${Math.round(1 / exifData.ExposureTime)}s`);
          if (exifData.ISO) settings.push(`ISO ${exifData.ISO}`);
          if (exifData.FocalLength) settings.push(`${exifData.FocalLength}mm`);
          document.getElementById('exifSettings').value = settings.join(', ');
          
          statusText.innerText = "✅ 成功读取参数";
          statusText.className = "text-xs text-green-600 font-medium";
        } else {
          statusText.innerText = "⚠️ 图片无参数";
          statusText.className = "text-xs text-amber-500";
        }
      } catch (err) {
        statusText.innerText = "⚠️ 读取失败";
        statusText.className = "text-xs text-amber-500";
      }
    }

    function submitPhoto() {
      const author = document.getElementById('uploadAuthor').value.trim();
      const location = document.getElementById('photoLocation').value.trim();
      if (!author || !pendingImageObj) return alert("昵称和照片是必填项！");

      localStorage.setItem('kanto_bird_user', author);
      const badge = document.getElementById('userBadge');
      badge.innerText = `👋 欢迎回来, ${author}`;
      badge.classList.remove('hidden');

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.innerText = "⏳ 正在上传至云端...";
      submitBtn.disabled = true;
      
      const payload = {
        birdName: currentBird.zhName,
        author: author,
        location: location || "未提供",
        camera: document.getElementById('exifCamera').value,
        settings: document.getElementById('exifSettings').value,
        date: new Date().toLocaleDateString(),
        imageBase64: pendingImageObj
      };

      fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      }).then(response => response.json())
        .then(res => {
        if(res.status === "success") {
          alert("✅ 打卡成功！刷新页面即可看到。");
          window.location.reload();
        } else {
          alert("❌ 云端报错：" + res.message);
          submitBtn.innerText = "重新尝试";
          submitBtn.disabled = false;
        }
      }).catch(err => {
        alert("❌ 上传中断，请检查网络或刷新重试。");
        submitBtn.innerText = "重新尝试";
        submitBtn.disabled = false;
      });
    }

    document.getElementById('searchInput').addEventListener('input', renderGallery);
  </script>
</body>
</html>
